name: Test Suite

on:
  push:
    branches:
      - main
      - '*.x'
    paths:
      - 'config/**'
      - 'lang/**'
      - 'routes/**'
      - 'src/**'
      - 'tests/**'
      - '**.php'
      - composer.json
      - phpunit.xml
      - .github/workflows/tests.yaml
  pull_request:
    paths:
      - 'config/**'
      - 'lang/**'
      - 'routes/**'
      - 'src/**'
      - 'tests/**'
      - '**.php'
      - composer.json
      - phpunit.xml
      - .github/workflows/tests.yaml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php_tests:
    if: "!contains(github.event.head_commit.message, 'changelog')"

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        os: [ubuntu-latest]
        shard: [1, 2, 3, 4]
        shards: [4] # single value, so it doesn't multiply the combinations
        # An include entry that overrides an existing matrix key (os) creates a standalone
        # combination rather than merging, so it wouldn't inherit the shard dimension.
        # Windows isn't sharded because its test step is already fast enough.
        include:
          - os: windows-latest
            php: 8.5
            laravel: 13.*
            stability: prefer-stable
            shard: 1
            shards: 1

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }} - shard ${{ matrix.shard }}/${{ matrix.shards }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, exif, gd, pdo, sqlite, pdo_sqlite, intl, zip

      - name: Install dependencies
        # zizmor: ignore[template-injection] - matrix values are defined in this file, not attacker-controlled
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-suggest

      - name: Execute tests
        run: vendor/bin/pest --shard=${{ matrix.shard }}/${{ matrix.shards }} --ci --exclude-group=payments # zizmor: ignore[template-injection] shard is a static list defined in the matrix above

  # The payment tests only cover the payment gateway implementations, so they don't
  # need to run against the whole matrix.
  payment_tests:
    if: "!contains(github.event.head_commit.message, 'changelog')"

    runs-on: ubuntu-latest
    permissions:
      contents: read

    name: Payments

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5
          extensions: fileinfo, exif, gd, pdo, sqlite, pdo_sqlite, intl, zip

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-suggest

      - name: Execute tests
        run: vendor/bin/phpunit --group=payments
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          # MOLLIE_KEY: ${{ secrets.MOLLIE_KEY }}
          # MOLLIE_PROFILE: ${{ secrets.MOLLIE_PROFILE }}
