name: Docs

on:
  push:
    branches:
      - 1.x
    paths:
      - 'docs/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-docs:
    name: 'Update docs'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Deploy
        uses: jbrooksuk/laravel-forge-action@916b17213d00299c2f2e9462df2bb36504ebf974 # v2.0.0
        with:
          trigger_url: ${{ secrets.DOCS_TRIGGER_URL }}