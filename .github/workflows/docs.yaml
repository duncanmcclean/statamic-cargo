name: Docs

on:
  push:
    branches:
      - 1.x
    paths:
      - 'docs/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-docs:
    name: 'Update docs'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Deploy to Laravel Cloud
        env:
          DOCS_TRIGGER_URL: ${{ secrets.DOCS_TRIGGER_URL }}
        run: curl --fail --silent --show-error --request POST "$DOCS_TRIGGER_URL"
