name: Pull Requests

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  uneditable:
    name: Close PRs that don't allow maintainer edits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # Post comment and close PRs that don't allow maintainer edits

    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;

            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    headRepositoryOwner {
                      __typename
                      login
                    }
                    maintainerCanModify
                    state
                  }
                }
              }
            `;

            const pullNumber = context.issue.number;
            const variables = { owner, repo, number: pullNumber };

            try {
              console.log(`Check for maintainer edit access ...`);
              const result = await github.graphql(query, variables);
              console.log(JSON.stringify(result, null, 2));
              const pullRequest = result.repository.pullRequest;

              if (pullRequest.headRepositoryOwner.login === owner) {
                console.log(`PR owned by ${owner}`);
                return;
              }

              if (pullRequest.state !== 'OPEN') {
                console.log('PR has already been closed or merged');
                return;
              }

              const ownedByOrganization = pullRequest.headRepositoryOwner.__typename === 'Organization';

              if (!pullRequest.maintainerCanModify || ownedByOrganization) {
                console.log(`PR not owned by ${owner} and does not allow maintainer edits`);

                await github.rest.issues.createComment({
                  issue_number: pullNumber,
                  owner,
                  repo,
                  body: "Thanks for submitting a pull request! 🙂\n\nThis repository requires pull requests to allow edits from maintainers before they can be reviewed. This makes it possible to push small tweaks before merging, rather than going back and forth. For information on how to enable it, [see the relevant GitHub documentation](https://docs.github.com/en/github/collaborating-with-pull-requests/working-with-forks/allowing-changes-to-a-pull-request-branch-created-from-a-fork).\n\nAdditionally, GitHub doesn't allow maintainer permissions from organisation forks. Please resubmit it from a personal GitHub account with 'Allow edits from maintainers' enabled."
                });

                await github.rest.pulls.update({
                  pull_number: pullNumber,
                  owner,
                  repo,
                  state: 'closed'
                });
              }
            } catch(e) {
              console.log(e);
            }
